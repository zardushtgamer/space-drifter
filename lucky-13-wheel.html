<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lucky 13 Wheel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root {
    --ink: #2a1d0d;
    --ink-soft: #6b5a3f;
    --ground: #fbf5e8;
    --ground-raised: #ffffff;
    --gold: #b8860b;
    --gold-bright: #e0ac1f;
    --hub: #3a2a12;
    --ring: #d9c9a3;
    --good: #2e8b57;
    --bad: #b0402f;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #f3e9d2;
      --ink-soft: #c9b892;
      --ground: #15100a;
      --ground-raised: #201808;
      --gold: #e0ac1f;
      --gold-bright: #ffd452;
      --hub: #efd996;
      --ring: #4a3a1e;
      --good: #4caf7d;
      --bad: #e06b52;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ink: #f3e9d2;
    --ink-soft: #c9b892;
    --ground: #15100a;
    --ground-raised: #201808;
    --gold: #e0ac1f;
    --gold-bright: #ffd452;
    --hub: #efd996;
    --ring: #4a3a1e;
    --good: #4caf7d;
    --bad: #e06b52;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    padding-inline: 16px;
    padding-block: 32px;
    display: flex;
    justify-content: center;
  }

  .layout {
    width: 100%;
    max-width: 820px;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    gap: 22px;
    flex-wrap: wrap;
  }

  .page {
    width: 100%;
    max-width: 520px;
    flex: 1 1 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
  }

  .crypto-panel {
    width: 100%;
    max-width: 280px;
    flex: 0 0 260px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: var(--ground-raised);
    border: 1px solid var(--ring);
    border-radius: 16px;
    padding: 16px;
    position: sticky;
    top: 20px;
  }
  .crypto-panel[hidden] { display: none; }
  @media (max-width: 760px) {
    .crypto-panel { position: static; max-width: 420px; flex-basis: auto; }
  }

  .crypto-title {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .crypto-fake-tag {
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 0.6rem;
    letter-spacing: 0.08em;
    color: var(--bad);
    border: 1px solid var(--bad);
    border-radius: 6px;
    padding: 1px 5px;
  }
  .crypto-price-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .crypto-price {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 1.3rem;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }
  .crypto-change {
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 0.82rem;
    font-variant-numeric: tabular-nums;
  }
  .crypto-change.up { color: var(--good); }
  .crypto-change.down { color: var(--bad); }
  .crypto-chart {
    width: 100%;
    height: 70px;
    display: block;
    border-radius: 8px;
    background: var(--ground);
  }
  .crypto-holdings {
    font-family: 'Inter', sans-serif;
    font-size: 0.76rem;
    color: var(--ink-soft);
  }
  .crypto-actions {
    display: flex;
    gap: 8px;
  }
  .crypto-btn {
    flex: 1;
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 0.78rem;
    padding: 8px 6px;
    border-radius: 8px;
    border: 2px solid var(--good);
    background: transparent;
    color: var(--good);
    cursor: pointer;
  }
  .crypto-btn.sell { border-color: var(--bad); color: var(--bad); }
  .crypto-btn:hover:not(:disabled) { filter: brightness(1.15); }
  .crypto-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .crypto-btn:focus-visible { outline: 3px solid var(--gold-bright); outline-offset: 2px; }

  .topbar {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .games-row {
    width: 100%;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .game-launch-btn {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 0.82rem;
    padding: 8px 16px;
    border-radius: 999px;
    border: 2px solid var(--gold);
    background: transparent;
    color: var(--ink);
    cursor: pointer;
  }
  .game-launch-btn:hover { background: var(--gold); color: #241a06; }
  .game-launch-btn:focus-visible { outline: 3px solid var(--gold-bright); outline-offset: 2px; }
  .game-launch-btn[hidden] { display: none; }

  .news-ticker {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 8;
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    background: #1a1208;
    color: #f3e9d2;
    border-bottom: 2px solid var(--gold);
    padding: 6px 0;
    overflow: hidden;
  }
  .news-ticker[hidden] { display: none; }
  body.has-ticker { padding-top: 66px; }
  .news-tag {
    flex-shrink: 0;
    font-family: 'Inter', sans-serif;
    font-weight: 800;
    font-size: 0.7rem;
    letter-spacing: 0.06em;
    background: var(--bad);
    color: #fff;
    padding: 3px 10px;
    margin-left: 14px;
    border-radius: 4px;
  }
  .news-track {
    flex: 1;
    overflow: hidden;
    white-space: nowrap;
  }
  .news-text {
    display: inline-block;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 0.8rem;
    padding-left: 100%;
    animation: newsScroll 22s linear infinite;
  }
  @keyframes newsScroll {
    from { transform: translateX(0); }
    to { transform: translateX(-100%); }
  }
  @media (prefers-reduced-motion: reduce) {
    .news-text { animation-duration: 60s; }
  }

  .coin-badge {
    display: flex;
    align-items: center;
    gap: 7px;
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 1.05rem;
    color: var(--ink);
    background: var(--ground-raised);
    border: 1px solid var(--ring);
    border-radius: 999px;
    padding: 6px 14px 6px 8px;
    position: relative;
  }
  .coin-badge svg { width: 22px; height: 22px; flex-shrink: 0; }
  .coin-count { font-variant-numeric: tabular-nums; }

  .ads-badge {
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 0.75rem;
    color: var(--good);
    border: 1px solid var(--good);
    border-radius: 999px;
    padding: 5px 12px;
  }
  .ads-badge[hidden] { display: none; }

  .shop-btn {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 0.85rem;
    padding: 9px 18px;
    border-radius: 999px;
    border: 2px solid var(--gold);
    background: transparent;
    color: var(--ink);
    cursor: pointer;
  }
  .shop-btn:hover { background: var(--gold); color: #241a06; }
  .shop-btn:focus-visible { outline: 3px solid var(--gold-bright); outline-offset: 2px; }

  .toast {
    position: absolute;
    top: -6px;
    right: 8px;
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 0.85rem;
    color: var(--good);
    pointer-events: none;
    animation: floatUp 900ms ease-out forwards;
  }
  @keyframes floatUp {
    0% { opacity: 0; transform: translateY(4px); }
    20% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-22px); }
  }
  @media (prefers-reduced-motion: reduce) { .toast { animation: none; opacity: 0; } }

  .eyebrow {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 0.72rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold);
  }

  h1 {
    font-family: 'Cinzel', serif;
    font-weight: 900;
    font-size: clamp(1.9rem, 7vw, 2.6rem);
    margin: 0;
    text-align: center;
    text-wrap: balance;
    letter-spacing: 0.01em;
    background: linear-gradient(90deg,
      #c0392b, #e67e22, #e0ac1f, #2e8b57, #1f7a8c, #3b5fc0, #8e44ad, #c0392b);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shimmer 8s linear infinite;
  }
  @media (prefers-reduced-motion: reduce) { h1 { animation: none; } }
  @keyframes shimmer { to { background-position: 200% center; } }

  .wheel-stage {
    position: relative;
    width: min(88vw, 400px);
    aspect-ratio: 1;
  }

  .pointer {
    position: absolute;
    top: -14px;
    left: 50%;
    transform: translateX(-50%);
    width: 34px;
    height: 40px;
    z-index: 3;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.35));
  }

  #wheel {
    width: 100%;
    height: 100%;
    display: block;
    border-radius: 50%;
  }

  .rim {
    position: absolute;
    inset: -3%;
    border-radius: 50%;
    background: conic-gradient(from 0deg,
      #f7e08a, #b8860b, #ffe9a8, #8a6112, #f7e08a);
    z-index: 0;
    filter: drop-shadow(0 8px 20px rgba(0,0,0,0.25));
  }

  .wheel-inner {
    position: absolute;
    inset: 3%;
    border-radius: 50%;
    overflow: hidden;
    z-index: 1;
    box-shadow: inset 0 0 0 2px var(--ring);
  }

  .hub {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 17%;
    height: 17%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--gold-bright), var(--gold) 55%, var(--hub) 100%);
    z-index: 2;
    box-shadow: 0 2px 6px rgba(0,0,0,0.4), inset 0 0 0 2px rgba(255,255,255,0.25);
  }

  .controls {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    width: 100%;
  }

  button#spin {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 1.05rem;
    letter-spacing: 0.06em;
    padding: 14px 40px;
    border-radius: 999px;
    border: 2px solid var(--gold);
    background: linear-gradient(180deg, var(--gold-bright), var(--gold));
    color: #241a06;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(184,134,11,0.35);
    transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
  }
  button#spin:hover { filter: brightness(1.06); transform: translateY(-1px); }
  button#spin:active { transform: translateY(0); box-shadow: 0 3px 8px rgba(184,134,11,0.3); }
  button#spin:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
  button#spin:focus-visible { outline: 3px solid var(--gold-bright); outline-offset: 3px; }

  .result {
    min-height: 30px;
    font-family: 'Inter', sans-serif;
    font-size: 1rem;
    color: var(--ink-soft);
    text-align: center;
  }
  .result strong {
    font-family: 'Cinzel', serif;
    color: var(--ink);
    font-size: 1.2rem;
  }

  .history {
    width: 100%;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    min-height: 32px;
  }
  .chip {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 0.78rem;
    padding: 4px 11px;
    border-radius: 999px;
    background: var(--ground-raised);
    border: 1px solid var(--ring);
    color: var(--ink-soft);
  }

  .wedge-control {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'Inter', sans-serif;
    font-size: 0.85rem;
    color: var(--ink-soft);
  }
  .wedge-control label {
    font-weight: 600;
  }
  .wedge-control input[type="number"] {
    width: 4.5em;
    font-family: 'Inter', sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--ink);
    background: var(--ground-raised);
    border: 1px solid var(--ring);
    border-radius: 8px;
    padding: 5px 8px;
    text-align: center;
  }
  .wedge-control input[type="number"]:focus-visible {
    outline: 3px solid var(--gold-bright);
    outline-offset: 1px;
  }
  .wedge-control input[type="range"] {
    accent-color: var(--gold);
    width: 140px;
  }

  .arcade {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: center;
  }
  .arcade-label {
    font-family: 'Inter', sans-serif;
    font-size: 0.76rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .arcade-box {
    position: relative;
    width: 100%;
    height: 84px;
    border-radius: 14px;
    border: 1px dashed var(--ring);
    background: var(--ground-raised);
    overflow: hidden;
  }
  .dvd-coin {
    position: absolute;
    top: 0;
    left: 0;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 2px solid var(--gold);
    background: radial-gradient(circle at 35% 30%, var(--gold-bright), var(--gold) 60%, #8a6112 100%);
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    cursor: pointer;
    padding: 0;
    transition: transform 0.12s ease;
    will-change: transform;
  }
  .dvd-coin:hover { transform: scale(1.08); }
  .dvd-coin:focus-visible { outline: 3px solid var(--gold-bright); outline-offset: 2px; }
  .dvd-coin.popped { animation: pop 260ms ease-out; }
  @keyframes pop {
    0% { transform: scale(1); }
    40% { transform: scale(1.4); }
    100% { transform: scale(1); }
  }
  @media (prefers-reduced-motion: reduce) { .dvd-coin.popped { animation: none; } }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 7, 2, 0.62);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 10;
  }
  .modal-overlay[hidden] {
    display: none;
  }
  .modal-card {
    width: 100%;
    max-width: 400px;
    max-height: 86vh;
    overflow-y: auto;
    background: var(--ground-raised);
    border: 2px solid var(--gold);
    border-radius: 18px;
    padding: 26px 22px 22px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .modal-title {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 1.3rem;
    color: var(--gold);
    text-align: center;
  }
  .modal-title.duo { color: var(--good); }
  .duo-avatar {
    width: 84px;
    height: 84px;
    display: block;
    margin: 0 auto;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,0.3));
  }
  .modal-body {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  button.modal-close {
    align-self: center;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 0.85rem;
    padding: 8px 18px;
    border-radius: 999px;
    border: 1px solid var(--ring);
    background: transparent;
    color: var(--ink-soft);
    cursor: pointer;
  }
  button.modal-close:hover { color: var(--ink); border-color: var(--gold); }
  button.modal-close:focus-visible { outline: 3px solid var(--gold-bright); outline-offset: 2px; }

  .upgrade-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 14px;
    border: 1px solid var(--ring);
    border-radius: 12px;
    background: var(--ground);
  }
  .upgrade-info { display: flex; flex-direction: column; gap: 2px; }
  .upgrade-name { font-weight: 700; font-size: 0.92rem; }
  .upgrade-desc { font-size: 0.78rem; color: var(--ink-soft); }
  .upgrade-level { font-size: 0.72rem; color: var(--gold); font-weight: 600; }
  .buy-btn {
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 0.82rem;
    padding: 8px 14px;
    border-radius: 999px;
    border: 2px solid var(--gold);
    background: var(--gold);
    color: #241a06;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .buy-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    background: transparent;
    color: var(--ink-soft);
  }
  .buy-btn:focus-visible { outline: 3px solid var(--gold-bright); outline-offset: 2px; }

  .trivia-copy {
    text-align: center;
    font-size: 0.95rem;
  }
  .trivia-options {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .trivia-btn {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 0.88rem;
    padding: 10px 14px;
    border-radius: 10px;
    border: 2px solid var(--ring);
    background: var(--ground);
    color: var(--ink);
    cursor: pointer;
    text-align: left;
  }
  .trivia-btn:hover:not(:disabled) { border-color: var(--gold); }
  .trivia-btn:disabled { cursor: not-allowed; }
  .trivia-btn.correct { border-color: var(--good); background: color-mix(in srgb, var(--good) 18%, var(--ground)); }
  .trivia-btn.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 18%, var(--ground)); }
  .trivia-btn:focus-visible { outline: 3px solid var(--gold-bright); outline-offset: 2px; }
  .trivia-outcome { text-align: center; font-size: 0.85rem; color: var(--ink-soft); min-height: 18px; }
  .game-outcome { text-align: center; font-size: 0.88rem; color: var(--ink-soft); min-height: 20px; }

  .reels-row {
    display: flex;
    justify-content: center;
    gap: 10px;
  }
  .reel {
    width: 62px;
    height: 62px;
    border-radius: 10px;
    border: 2px solid var(--gold);
    background: var(--ground);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cinzel', serif;
    font-weight: 900;
    font-size: 1.5rem;
    color: var(--ink);
  }
  .bet-row {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .bet-btn {
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 0.85rem;
    padding: 9px 16px;
    border-radius: 999px;
    border: 2px solid var(--gold);
    background: var(--gold);
    color: #241a06;
    cursor: pointer;
  }
  .bet-btn:disabled { opacity: 0.5; cursor: not-allowed; background: transparent; color: var(--ink-soft); }
  .bet-btn:focus-visible { outline: 3px solid var(--gold-bright); outline-offset: 2px; }
  .payout-table {
    font-family: 'Inter', sans-serif;
    font-size: 0.72rem;
    color: var(--ink-soft);
    text-align: center;
    line-height: 1.5;
  }

  .jack-hands {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .jack-hand-label {
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 0.78rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
  .jack-cards {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .jack-card {
    min-width: 38px;
    height: 52px;
    padding: 0 4px;
    border-radius: 6px;
    border: 2px solid var(--ring);
    background: var(--ground-raised);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 1rem;
    color: var(--ink);
  }
  .jack-card.hidden-card {
    background: linear-gradient(135deg, var(--gold), var(--gold-bright));
    color: transparent;
    border-color: var(--gold);
  }
  .jack-total {
    font-family: 'Inter', sans-serif;
    font-size: 0.8rem;
    color: var(--ink-soft);
    margin-top: 4px;
  }

  .dvd-logo {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 6;
    pointer-events: none;
    width: 112px;
    height: 62px;
    filter: drop-shadow(0 2px 5px rgba(0,0,0,0.45));
    will-change: transform;
  }
  .dvd-logo svg { width: 100%; height: 100%; display: block; }

  .ramson-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.88);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 50;
    transition: background 0.3s ease;
  }
  .ramson-overlay[hidden] { display: none; }
  .ramson-overlay.hud-mode {
    background: transparent;
    align-items: flex-end;
    justify-content: flex-end;

  @media (prefers-reduced-motion: reduce) { .ramson-popup { transition: none; } }
  .ramson-card {

  .ramson-body {

<script>
(function () {
  // ---------- Persistent coin / upgrade state ----------
  const STORAGE_KEY = 'lucky13wheel-state-v1';
  let state = { coins: 0, levels: {}, spinCoin: 0 };
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
    if (saved && typeof saved === 'object') {
      state.coins = Number(saved.coins) || 0;
      state.levels = saved.levels && typeof saved.levels === 'object' ? saved.levels : {};
      state.spinCoin = Number(saved.spinCoin) || 0;
    }
  } catch (e) { /* ignore */ }

  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
  }

  const UPGRADES = [
    {
      id: 'multiplier', name: 'Coin Multiplier', baseCost: 50, growth: 1.6, maxLevel: 6,
      desc: (lvl) => `All coin rewards ×${(1 + lvl * 0.5).toFixed(1)}`,
    },
    {
      id: 'quickspin', name: 'Quick Spin', baseCost: 40, growth: 1.5, maxLevel: 4,
      desc: (lvl) => lvl >= 4 ? 'Spin time cut by 60% (max)' : `Spin time -${lvl * 15}%`,
    },
    {
      id: 'wedgecap', name: 'Wedge Workshop', baseCost: 60, growth: 1.7, maxLevel: 4,
      desc: (lvl) => `Raises the max wedge count by ${lvl * 4} (now ${24 + lvl * 4})`,
    },
    {
      id: 'autobounce', name: 'Auto-Collector', baseCost: 150, growth: 1, maxLevel: 1,
      desc: () => 'Automatically taps the bouncing coin for you every few seconds',
    },
    {
      id: 'goldenskin', name: 'Golden Skin', baseCost: 120, growth: 1, maxLevel: 1,
      desc: () => 'Recolors every wedge in pure gilded tones',
    },
    {
      id: 'duobird', name: 'Adopt Duo', baseCost: 200, growth: 1, maxLevel: 1,
      desc: () => 'The owl moves in and starts quizzing you on language between spins. Bigger coin reward, no pressure (he says).',
    },
    {
      id: 'crypto', name: 'Crypto Exchange', baseCost: 300, growth: 1, maxLevel: 1,
      desc: () => 'Unlocks a (fake) SpinCoin exchange sidebar — gamble your coins on a volatile market that ticks every second.',
    },
    {
      id: 'spinmachine', name: 'SpinMachine', baseCost: 250, growth: 1, maxLevel: 1,
      desc: () => 'Unlocks a slot machine — bet coins, pull the lever, chase the triple 7s.',
    },
    {
      id: 'spinjack', name: 'SpinJack', baseCost: 250, growth: 1, maxLevel: 1,
      desc: () => 'Unlocks a blackjack table — beat the dealer to double your bet.',
    },
    {
      id: 'newsticker', name: 'Breaking News Ticker', baseCost: 180, growth: 1, maxLevel: 1,
      desc: () => 'A scrolling (fake) news ticker across the top of the screen. Pays 10 coins every 5 seconds, no reading required.',
    },
    {
      id: 'ads', name: 'Ad Revenue', baseCost: 800, growth: 1, maxLevel: 1,
      desc: () => 'Runs (fake) ads in the background for passive income: 50 coins every second.',
    },
    {
      id: 'dvdscreensaver', name: 'DVD Screensaver', baseCost: 150, growth: 1, maxLevel: 10,
      desc: (lvl) => `Adds a bouncing DVD logo to the screen (${lvl}/10 active). +15 coins per wall bounce, +100 for an exact corner hit.`,
    },
  ];

  function getLevel(id) { return state.levels[id] || 0; }
  function costFor(upg) { return Math.round(upg.baseCost * Math.pow(upg.growth, getLevel(upg.id))); }
  function coinMultiplier() { return 1 + getLevel('multiplier') * 0.5; }
  function spinDurationMs() { return 4200 * (1 - Math.min(getLevel('quickspin'), 4) * 0.15); }
  function hasDuoBird() { return getLevel('duobird') >= 1; }
  function hasCrypto() { return getLevel('crypto') >= 1; }
  function hasSlots() { return getLevel('spinmachine') >= 1; }
  function hasBlackjack() { return getLevel('spinjack') >= 1; }
  function hasNewsTicker() { return getLevel('newsticker') >= 1; }
  function hasAds() { return getLevel('ads') >= 1; }
  function dvdLogoCount() { return getLevel('dvdscreensaver'); }
  function wedgeCap() { return 24 + getLevel('wedgecap') * 4; }
  function hasGoldenSkin() { return getLevel('goldenskin') >= 1; }
  function hasAutoBounce() { return getLevel('autobounce') >= 1; }

  // ---------- Coin UI ----------
  const coinBadge = document.getElementById('coinBadge');
  const coinCountEl = document.getElementById('coinCount');
  let hacked = false;

  function renderCoins() {
    coinCountEl.textContent = Math.floor(state.coins).toLocaleString();
  }
  renderCoins();

  function earnCoins(baseAmount, opts) {
    const amount = Math.max(1, Math.round(baseAmount * coinMultiplier()));
    if (hacked) {
      ramsonCollected += amount;
      checkRamsonPayoff();
      showToast('→ Ramson', opts && opts.el);
      return 0;
    }
    state.coins += amount;
    renderCoins();
    saveState();
    showToast(`+${amount}`, opts && opts.el);
    return amount;
  }

  function showToast(text, anchorEl) {
    const toast = document.createElement('span');
    toast.className = 'toast';
    toast.textContent = text;
    const host = anchorEl || coinBadge;
    host.appendChild(toast);
    setTimeout(() => toast.remove(), 950);
  }

  // ---------- Wheel ----------
  const MIN_SEGMENTS = 2;
  let SEGMENTS = 13;
  let labels = [];
  let segAngle = (Math.PI * 2) / SEGMENTS;

  function rebuildLabels() {
    labels = Array.from({ length: SEGMENTS }, (_, i) => String(i + 1));
    segAngle = (Math.PI * 2) / SEGMENTS;
  }
  rebuildLabels();

  function goldWedge(hue, sat, canvas2ctx, cx, cy, r) {
    const grad = canvas2ctx.createRadialGradient(cx, cy, r * 0.12, cx, cy, r);
    grad.addColorStop(0, `hsl(${hue} ${sat}% 78%)`);
    grad.addColorStop(0.55, `hsl(${hue} ${sat}% 52%)`);
    grad.addColorStop(1, `hsl(${hue} ${sat}% 34%)`);
    return grad;
  }

  const canvas = document.getElementById('wheel');
  const ctx = canvas.getContext('2d');
  const size = canvas.width;
  const cx = size / 2, cy = size / 2, r = size / 2;

  function drawWheel(rotation) {
    ctx.clearRect(0, 0, size, size);
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rotation);
    ctx.translate(-cx, -cy);

    const golden = hasGoldenSkin();
    for (let i = 0; i < SEGMENTS; i++) {
      const hue = golden ? 38 + (i % 4) * 7 : Math.round((360 / SEGMENTS) * i);
      const sat = golden ? 72 : 68;
      const a0 = -Math.PI / 2 + i * segAngle;
      const a1 = a0 + segAngle;

      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, r, a0, a1);
      ctx.closePath();
      ctx.fillStyle = goldWedge(hue, sat, ctx, cx, cy, r);
      ctx.fill();

      ctx.save();
      ctx.strokeStyle = 'rgba(184,134,11,0.9)';
      ctx.lineWidth = size * 0.006;
      ctx.stroke();
      ctx.restore();

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(a0 + segAngle / 2);
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = 'rgba(30,20,6,0.88)';
      const fontScale = Math.min(0.07, Math.max(0.02, 0.62 / SEGMENTS));
      ctx.font = `700 ${size * fontScale}px Cinzel, serif`;
      ctx.fillText(labels[i], r * 0.86, 0);
      ctx.restore();
    }

    ctx.beginPath();
    ctx.arc(cx, cy, r * 0.985, 0, Math.PI * 2);
    ctx.lineWidth = size * 0.012;
    ctx.strokeStyle = '#b8860b';
    ctx.stroke();

    ctx.restore();
  }

  let currentRotation = 0;
  drawWheel(currentRotation);

  const spinBtn = document.getElementById('spin');
  const resultEl = document.getElementById('result');
  const historyEl = document.getElementById('history');
  const segRange = document.getElementById('segRange');
  const segNumber = document.getElementById('segNumber');
  const eyebrowEl = document.getElementById('eyebrow');
  let spinning = false;

  function updateEyebrow() {
    eyebrowEl.textContent = `${SEGMENTS} Gilded Wedge${SEGMENTS === 1 ? '' : 's'}`;
  }

  function applyWedgeCap() {
    const cap = wedgeCap();
    segRange.max = String(cap);
    segNumber.max = String(cap);
    if (SEGMENTS > cap) setSegmentCount(cap);
  }

  function setSegmentCount(n) {
    const cap = wedgeCap();
    const clamped = Math.max(MIN_SEGMENTS, Math.min(cap, Math.round(n)));
    if (clamped === SEGMENTS) { updateEyebrow(); return; }
    SEGMENTS = clamped;
    rebuildLabels();
    currentRotation = 0;
    segRange.value = String(SEGMENTS);
    segNumber.value = String(SEGMENTS);
    updateEyebrow();
    historyEl.innerHTML = '';
    resultEl.textContent = 'Press spin to draw a wedge.';
    drawWheel(currentRotation);
  }
  updateEyebrow();
  applyWedgeCap();

  segRange.addEventListener('input', () => {
    if (spinning) { segRange.value = String(SEGMENTS); return; }
    setSegmentCount(Number(segRange.value));
  });
  segNumber.addEventListener('change', () => {
    if (spinning) { segNumber.value = String(SEGMENTS); return; }
    const n = Number(segNumber.value);
    if (Number.isFinite(n)) setSegmentCount(n);
    else segNumber.value = String(SEGMENTS);
  });

  function addHistory(label) {
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.textContent = label;
    historyEl.prepend(chip);
    while (historyEl.children.length > 8) {
      historyEl.removeChild(historyEl.lastChild);
    }
  }

  function easeOutCubic(t) {
    return 1 - Math.pow(1 - t, 3);
  }

  function spin() {
    if (spinning) return;
    spinning = true;
    spinBtn.disabled = true;
    segRange.disabled = true;
    segNumber.disabled = true;
    resultEl.textContent = 'Spinning…';

    const winningIndex = Math.floor(Math.random() * SEGMENTS);
    const targetAngle = -(winningIndex * segAngle + segAngle / 2);
    const extraSpins = (4 + Math.floor(Math.random() * 3)) * Math.PI * 2;
    const startRotation = currentRotation;
    const normalizedStart = startRotation % (Math.PI * 2);
    const delta = extraSpins + (targetAngle - normalizedStart - Math.PI * 2 * Math.floor((targetAngle - normalizedStart) / (Math.PI * 2)));
    const endRotation = startRotation + delta;

    const duration = spinDurationMs();
    const t0 = performance.now();

    function frame(now) {
      const t = Math.min(1, (now - t0) / duration);
      const eased = easeOutCubic(t);
      currentRotation = startRotation + (endRotation - startRotation) * eased;
      drawWheel(currentRotation);
      if (t < 1) {
        requestAnimationFrame(frame);
      } else {
        spinning = false;
        spinBtn.disabled = false;
        segRange.disabled = false;
        segNumber.disabled = false;
        const label = labels[winningIndex];
        const wasHacked = hacked;
        const won = earnCoins(Number(label) || 1, { el: coinBadge });
        resultEl.innerHTML = wasHacked
          ? `Wedge <strong>${label}</strong> wins! Seized by Ramson.`
          : `Wedge <strong>${label}</strong> wins! +${won} coins`;
        addHistory(label);
      }
    }
    requestAnimationFrame(frame);
  }

  spinBtn.addEventListener('click', spin);

  // ---------- Shop / upgrades modal ----------
  const modalOverlay = document.getElementById('modalOverlay');
  const modalTitle = document.getElementById('modalTitle');
  const modalBody = document.getElementById('modalBody');
  const modalClose = document.getElementById('modalClose');
  const shopBtn = document.getElementById('shopBtn');
  let modalKind = null;

  function closeModal() {
    modalOverlay.hidden = true;
    modalBody.innerHTML = '';
    modalTitle.classList.remove('duo');
    modalKind = null;
  }
  modalClose.addEventListener('click', closeModal);
  modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeModal(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !modalOverlay.hidden) closeModal();
  });

  function renderShop() {
    modalTitle.textContent = 'Upgrade Shop';
    modalBody.innerHTML = '';
    UPGRADES.forEach((upg) => {
      const lvl = getLevel(upg.id);
      const maxed = lvl >= upg.maxLevel;
      const cost = costFor(upg);
      const card = document.createElement('div');
      card.className = 'upgrade-card';
      card.innerHTML = `

    cryptoCtx.clearRect(0, 0, w, h);
    const min = Math.min(...spinHistory);
    const max = Math.max(...spinHistory);
    const span = Math.max(0.01, max - min);
    cryptoCtx.beginPath();
    spinHistory.forEach((p, i) => {
      const x = (i / Math.max(1, spinHistory.length - 1)) * (w - 6) + 3;

    const playerCardsEl = modalBody.querySelector('#playerCards');
    const playerTotalEl = modalBody.querySelector('#playerTotal');
    const outcomeEl = modalBody.querySelector('#jackOutcome');
    const betRow = modalBody.querySelector('#jackBetRow');
    const playRow = modalBody.querySelector('#jackPlayRow');
    const betButtons = [
      modalBody.querySelector('#jackBet10'),
      modalBody.querySelector('#jackBet25'),
      modalBody.querySelector('#jackBet50'),
    ];
    const betAmounts = [10, 25, 50];
    const hitBtn = modalBody.querySelector('#jackHit');
    const standBtn = modalBody.querySelector('#jackStand');

    let bet = 0;
    let playerCards = [];
    let dealerCards = [];
    let hideDealerHole = false;

    function cardEl(rank, hidden) {
      const el = document.createElement('div');
      el.className = 'jack-card' + (hidden ? ' hidden-card' : '');
      el.textContent = hidden ? '?' : rank;
      return el;
    }

    function renderHands() {
      dealerCardsEl.innerHTML = '';
      dealerCards.forEach((c, i) => dealerCardsEl.appendChild(cardEl(c, hideDealerHole && i === 1)));
      dealerTotalEl.textContent = hideDealerHole ? `Showing ${cardValue(dealerCards[0])}` : `Total ${handTotal(dealerCards)}`;
      playerCardsEl.innerHTML = '';
      playerCards.forEach((c) => playerCardsEl.appendChild(cardEl(c, false)));
      playerTotalEl.textContent = `Total ${handTotal(playerCards)}`;
    }

    function refreshBetButtons() {
      betButtons.forEach((btn, i) => { btn.disabled = hacked || state.coins < betAmounts[i]; });
    }
    refreshBetButtons();

    function deal(amount) {
      if (state.coins < amount || hacked) return;
      bet = amount;
      state.coins -= bet;
      saveState();
      renderCoins();
      playerCards = [drawCard(), drawCard()];
      dealerCards = [drawCard(), drawCard()];
      hideDealerHole = true;
      betRow.hidden = true;
      playRow.hidden = false;
      outcomeEl.textContent = '';
      renderHands();
      if (handTotal(playerCards) === 21) finishRound();
    }

    function finishRound() {
      hideDealerHole = false;
      playRow.hidden = true;
      const playerTotal = handTotal(playerCards);
      if (playerTotal > 21) {
        renderHands();
        outcomeEl.textContent = `Bust at ${playerTotal}. You lose ${bet} coins.`;
        endRound();
        return;
      }
      while (handTotal(dealerCards) < 17) dealerCards.push(drawCard());
      renderHands();
      const dealerTotal = handTotal(dealerCards);
      if (dealerTotal > 21) {
        const won = earnCoins(bet * 2, {});
        outcomeEl.textContent = `Dealer busts at ${dealerTotal}. You win ${won} coins!`;
      } else if (playerTotal === 21 && playerCards.length === 2 && !(dealerTotal === 21 && dealerCards.length === 2)) {
        const won = earnCoins(Math.round(bet * 2.5), {});
        outcomeEl.textContent = `Blackjack! +${won} coins.`;
      } else if (playerTotal > dealerTotal) {
        const won = earnCoins(bet * 2, {});
        outcomeEl.textContent = `You win ${playerTotal} to ${dealerTotal}! +${won} coins.`;
      } else if (playerTotal === dealerTotal) {
        if (hacked) {
          outcomeEl.textContent = `Push at ${playerTotal} — but Ramson kept the bet back.`;
        } else {
          state.coins += bet;
          saveState();
          renderCoins();
          outcomeEl.textContent = `Push at ${playerTotal}. Bet returned.`;
        }
      } else {
        outcomeEl.textContent = `Dealer wins ${dealerTotal} to ${playerTotal}. You lose ${bet} coins.`;
      }
      endRound();
    }

    function endRound() {
      betRow.hidden = false;
      refreshBetButtons();
    }

    hitBtn.addEventListener('click', () => {
      playerCards.push(drawCard());
      renderHands();
      if (handTotal(playerCards) >= 21) finishRound();
    });
    standBtn.addEventListener('click', finishRound);
    betButtons.forEach((btn, i) => btn.addEventListener('click', () => deal(betAmounts[i])));

    renderHands();
  }

  jackBtn.addEventListener('click', () => {
    renderBlackjack();
    modalOverlay.hidden = false;
  });

  // ---------- DVD Screensaver (up to 10 bouncing logos) ----------
  const DVD_COLORS = ['#e74c3c', '#e67e22', '#f1c40f', '#2ecc71', '#1abc9c', '#3498db', '#9b59b6', '#e91e63'];
  const dvdLogos = [];
  let dvdLoopRunning = false;
  const DVD_W = 112, DVD_H = 62;
  const DVD_LOGO_SVG = `
    <svg viewBox="0 0 200 112" aria-hidden="true">
      <text x="100" y="66" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-weight="900" font-style="italic" font-size="66" fill="currentColor">DVD</text>
      <ellipse cx="100" cy="94" rx="82" ry="13" fill="currentColor"/>
      <ellipse cx="100" cy="94" rx="20" ry="5" fill="#000" opacity="0.55"/>
    </svg>
  `;

  function randomDvdColor(excludeColor) {
    const options = DVD_COLORS.filter((c) => c !== excludeColor);
    return options[Math.floor(Math.random() * options.length)];
  }

  function spawnDvdLogo() {
    const el = document.createElement('div');
    el.className = 'dvd-logo';
    el.innerHTML = DVD_LOGO_SVG;
    const color = randomDvdColor(null);
    el.style.color = color;
    document.body.appendChild(el);
    const maxX = Math.max(0, window.innerWidth - DVD_W);
    const maxY = Math.max(0, window.innerHeight - DVD_H);
    const angle = Math.random() * Math.PI * 2;
    const speed = 1.6 + Math.random() * 0.8;
    dvdLogos.push({
      el,
      color,
      x: Math.random() * maxX,
      y: Math.random() * maxY,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
    });
  }

  function syncDvdLogos() {
    const target = dvdLogoCount();
    while (dvdLogos.length < target) spawnDvdLogo();
    if (dvdLogos.length > 0 && !dvdLoopRunning) {
      dvdLoopRunning = true;
      requestAnimationFrame(stepDvdLogos);
    }
  }

  function stepDvdLogos() {
    const maxX = Math.max(0, window.innerWidth - DVD_W);
    const maxY = Math.max(0, window.innerHeight - DVD_H);
    dvdLogos.forEach((logo) => {
      logo.x += logo.vx;
      logo.y += logo.vy;
      let hitX = false, hitY = false;
      if (logo.x <= 0) { logo.x = 0; logo.vx = Math.abs(logo.vx); hitX = true; }
      if (logo.x >= maxX) { logo.x = maxX; logo.vx = -Math.abs(logo.vx); hitX = true; }
      if (logo.y <= 0) { logo.y = 0; logo.vy = Math.abs(logo.vy); hitY = true; }
      if (logo.y >= maxY) { logo.y = maxY; logo.vy = -Math.abs(logo.vy); hitY = true; }
      if (hitX || hitY) {
        logo.color = randomDvdColor(logo.color);
        logo.el.style.color = logo.color;
        if (!hacked) {
          if (hitX && hitY) {
            earnCoins(100, { el: logo.el });
          } else {
            earnCoins(15, { el: logo.el });
          }
        }
      }
      logo.el.style.transform = `translate(${logo.x}px, ${logo.y}px)`;
    });
    requestAnimationFrame(stepDvdLogos);
  }

  syncDvdLogos();

  // ---------- Ramson event (random lockout) ----------
  const ramsonOverlay = document.getElementById('ramsonOverlay');
  const ramsonBody = document.getElementById('ramsonBody');
  const RAMSON_VIDEO_URL = 'https://youtu.be/exHzwHllDqI';

  let ramsonPhase = 'idle'; // 'idle' | 'freeze' | 'caught' | 'paying' | 'resolved'
  let ramsonAmount = 0;
  let ramsonCollected = 0;
  let ramsonFreezeInterval = null;
  let ramsonMoveHandler = null;

  function totalUpgradeLevels() {
    return UPGRADES.reduce((sum, u) => sum + getLevel(u.id), 0);
  }

  function ransomRange() {
    const scaled = 300 + totalUpgradeLevels() * 350;
    return { min: 1, max: Math.max(1, Math.min(30000, scaled)) };
  }

  function scheduleRamsonEvent() {
    const delay = 90000 + Math.random() * 150000; // 1.5–4 minutes
    setTimeout(triggerRamson, delay);
  }

  function triggerRamson() {
    if (hacked) return;
    if (!modalOverlay.hidden) closeModal();
    hacked = true;
    const { min, max } = ransomRange();
    ramsonAmount = Math.floor(Math.random() * (max - min + 1)) + min;
    ramsonCollected = 0;
    ramsonOverlay.hidden = false;
    startRamsonFreeze();
  }

  function startRamsonFreeze() {
    ramsonPhase = 'freeze';
    let t = 3;
    renderRamsonFreeze(t);

    ramsonMoveHandler = () => {
      if (ramsonPhase !== 'freeze') return;
      ramsonPhase = 'caught';
      clearInterval(ramsonFreezeInterval);
      document.removeEventListener('mousemove', ramsonMoveHandler);
      document.removeEventListener('mousedown', ramsonMoveHandler);
      renderRamsonCaught();
    };
    document.addEventListener('mousemove', ramsonMoveHandler);
    document.addEventListener('mousedown', ramsonMoveHandler);

    ramsonFreezeInterval = setInterval(() => {
      t--;
      if (ramsonPhase !== 'freeze') return;
      if (t <= 0) {
        clearInterval(ramsonFreezeInterval);
        document.removeEventListener('mousemove', ramsonMoveHandler);
        document.removeEventListener('mousedown', ramsonMoveHandler);
        startRamsonPaying();
      } else {
        renderRamsonFreeze(t);
      }
    }, 1000);
  }

  function renderRamsonFreeze(t) {
    ramsonBody.innerHTML = `
      <p class="ramson-copy">Ramson is watching. Don't move your mouse. Don't click. Hold completely still or he'll notice.</p>
      <div class="ramson-amount" id="ramsonFreezeCount">${t}</div>
      <div class="ramson-timer">Toll if caught: ${ramsonAmount.toLocaleString()} coins</div>
    `;
  }

  function renderRamsonCaught() {
    ramsonBody.innerHTML = `
      <p class="ramson-copy" style="color:#ff8a7a; font-weight:700;">Movement detected. Ramson deploys virus.exe.</p>
      <div class="ramson-amount" style="font-size: 1.05rem;">Infecting…</div>
      <div class="ramson-progress"><div class="ramson-progress-bar" id="ramsonVirusBar"></div></div>
    `;
    const bar = ramsonBody.querySelector('#ramsonVirusBar');
    requestAnimationFrame(() => { bar.style.width = '100%'; });
    setTimeout(() => {
      startRamsonPaying();
    }, 1600);
  }

  function startRamsonPaying() {
    ramsonPhase = 'paying';
    ramsonOverlay.classList.add('hud-mode');
    renderRamsonPaying();
    startRamsonPopups();
  }

  function renderRamsonPaying() {
    ramsonBody.innerHTML = `
      <p class="ramson-copy">Ramson has a hand on every coin machine — except three. Spin the wheel, sell SpinCoin, or answer Duo's question when it pops up. Everything those pay out goes straight to him until the toll is clear.</p>
      <div class="ramson-amount" id="ramsonProgressLabel">0 / ${ramsonAmount.toLocaleString()} coins</div>
      <div class="ramson-progress"><div class="ramson-progress-bar" id="ramsonPayBar" style="background:#2ecc71;"></div></div>
      <span class="ramson-link">Dispatch from Ramson: <a href="${RAMSON_VIDEO_URL}" target="_blank" rel="noopener">watch his statement</a></span>
    `;
  }

  function checkRamsonPayoff() {
    if (ramsonPhase !== 'paying') return;
    const label = document.getElementById('ramsonProgressLabel');
    const bar = document.getElementById('ramsonPayBar');
    if (label) label.textContent = `${Math.floor(ramsonCollected).toLocaleString()} / ${ramsonAmount.toLocaleString()} coins`;
    if (bar) bar.style.width = `${Math.min(100, (ramsonCollected / ramsonAmount) * 100)}%`;
    if (ramsonCollected >= ramsonAmount) {
      stopRamsonPopups();
      renderRamsonOutcome(`Paid in full — ${Math.floor(ramsonCollected).toLocaleString()} coins reached Ramson. He restores your access.`);
    }
  }

  function renderRamsonOutcome(text) {
    ramsonPhase = 'resolved';
    ramsonOverlay.classList.remove('hud-mode');
    ramsonBody.innerHTML = `
      <p class="ramson-copy">${text}</p>
      <div class="ramson-actions">
        <button class="ramson-btn pay" id="ramsonContinue" type="button">Continue</button>
      </div>
    `;
    ramsonBody.querySelector('#ramsonContinue').addEventListener('click', () => {
      hacked = false;
      ramsonPhase = 'idle';
      spinBtn.disabled = spinning;
      ramsonOverlay.hidden = true;
      scheduleRamsonEvent();
    });
  }

  // ---------- Ramson nag popups ----------
  const RAMSON_POPUP_LINES = [
    "Spin the wheel. I'm waiting.",
    'Sell some SpinCoin. Time is money.',
    "Answer Duo's question already.",
    'Your coins look better in my wallet.',
    'This is fine. Everything is fine.',
    'Three ways out. Pick one.',
    "I'm not in a hurry. Are you?",
  ];
  let ramsonPopupInterval = null;

  function spawnRamsonPopup() {
    const popup = document.createElement('div');
    popup.className = 'ramson-popup';
    popup.textContent = 'RAMSON: ' + RAMSON_POPUP_LINES[Math.floor(Math.random() * RAMSON_POPUP_LINES.length)];
    document.body.appendChild(popup);
    setTimeout(() => popup.classList.add('fade-out'), 3400);
    setTimeout(() => popup.remove(), 4000);
  }

  function startRamsonPopups() {
    spawnRamsonPopup();
    ramsonPopupInterval = setInterval(spawnRamsonPopup, 8000 + Math.random() * 4000);
  }

  function stopRamsonPopups() {
    clearInterval(ramsonPopupInterval);
    ramsonPopupInterval = null;
  }

  // ---------- Admin panel (dev tools) ----------
  const adminToggle = document.getElementById('adminToggle');
  const adminPanel = document.getElementById('adminPanel');
  const adminTriggerRamson = document.getElementById('adminTriggerRamson');
  adminToggle.addEventListener('click', () => { adminPanel.hidden = !adminPanel.hidden; });
  adminTriggerRamson.addEventListener('click', () => triggerRamson());

  scheduleRamsonEvent();
})();
</script>
</body>
</html>
